name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    name: Deploy to 192.168.3.6
    runs-on:
      - self-hosted
      - linux
      - aitoearn-test
    env:
      APP_DIR: /home/btcfoxman/docker/rsshub
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -euo pipefail
          bash test/deploy.sh
