services:
  rsshub:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/${IMAGE_NAME:-rsshub}:${IMAGE_TAG:-test-latest}
    container_name: ai-rsshub
    restart: unless-stopped
    networks:
      - my-shared-net
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      CACHE_TYPE: ${CACHE_TYPE:-memory}
      CACHE_EXPIRE: ${CACHE_EXPIRE:-300}
      REQUEST_RETRY: ${REQUEST_RETRY:-2}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-10000}
    ports:
      - "1200:1200"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1200/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  my-shared-net:
    external: true
