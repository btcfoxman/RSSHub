services:
  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    container_name: ai-rsshub
    restart: unless-stopped
    networks:
      - my-shared-net
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: 300
      REQUEST_RETRY: 2
      REQUEST_TIMEOUT: 10000
    ports:
      - "1200:1200"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:1200/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  my-shared-net:
    external: true
